name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer & electron
        run: npm run build

      - name: Verify build outputs
        shell: pwsh
        run: |
          if (-not (Test-Path dist/index.html)) { throw 'missing dist/index.html' }
          if (-not (Test-Path dist-electron/main.cjs)) { throw 'missing dist-electron/main.cjs' }
          if (-not (Test-Path build/icon.ico)) { throw 'missing build/icon.ico' }
          Get-ChildItem dist, dist-electron, build | Format-Table Name, Length

      - name: Package Windows (NSIS + portable)
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}\electron-builder-cache
        run: |
          $ErrorActionPreference = 'Stop'
          npx electron-builder --win --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem release | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: suixinji-win
          path: |
            release/suixinji-*-setup.exe
            release/suixinji-*-portable.exe
            release/win-unpacked/**

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/suixinji-*-setup.exe
            release/suixinji-*-portable.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
